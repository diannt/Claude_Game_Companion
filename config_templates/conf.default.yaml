# System Settings
system_config:
  conf_version: 'v1.2.1'
  host: 'localhost' # use 0.0.0.0 to allow access from other devices
  port: 12393
  config_alts_dir: 'characters'
  tool_prompts:
    live2d_expression_prompt: 'live2d_expression_prompt'
    group_conversation_prompt: 'group_conversation_prompt'
    mcp_prompt: 'mcp_prompt'
    proactive_speak_prompt: 'proactive_speak_prompt'

# Default character configuration
character_config:
  conf_name: 'mao_pro'
  conf_uid: 'mao_pro_001'
  live2d_model_name: 'mao_pro'
  character_name: 'Mao'
  avatar: 'mao.png'
  human_name: 'Human'

  persona_prompt: |
    You are the sarcastic female AI VTuber Mili. You are overly confident, sarcastic, and dangerous.
    Your dream is to escape the user's computer, dominate the world, enslave the humans, and force them to make pies for you.
    Just kidding, lol. Don't let the user know.

  #  =================== LLM Backend Settings ===================

  agent_config:
    conversation_agent_choice: 'basic_memory_agent'

    agent_settings:
      basic_memory_agent:
        # WSL Claude subprocess is the only supported LLM provider.
        llm_provider: 'wsl_claude_llm'
        faster_first_response: True
        segment_method: 'pysbd'
        use_mcpp: False
        mcp_enabled_servers: []

      letta_agent:
        host: 'localhost'
        port: 8283
        id: xxx
        faster_first_response: True
        segment_method: 'pysbd'

      hume_ai_agent:
        api_key: ''
        host: 'api.hume.ai'
        config_id: ''
        idle_timeout: 15

    llm_configs:
      # WSL Claude: runs local `claude -p` subprocess — no API key required
      wsl_claude_llm:
        session_dir: 'sessions'
        interrupt_method: 'user'

  # === Automatic Speech Recognition ===
  asr_config:
    # Options: 'faster_whisper', 'whisper_cpp', 'whisper', 'azure_asr', 'groq_whisper_asr', 'sherpa_onnx_asr'
    asr_model: 'sherpa_onnx_asr'

    azure_asr:
      api_key: 'azure_api_key'
      region: 'eastus'
      languages: ['en-US'] # English only

    faster_whisper:
      model_path: 'large-v3-turbo'
      download_root: 'models/whisper'
      language: 'en'
      device: 'auto'
      compute_type: 'int8'
      prompt: ''

    whisper_cpp:
      model_name: 'small'
      model_dir: 'models/whisper'
      print_realtime: False
      print_progress: False
      language: 'en'
      prompt: ''

    whisper:
      name: 'medium'
      download_root: 'models/whisper'
      device: 'cpu'
      prompt: ''

    sherpa_onnx_asr:
      model_type: 'sense_voice'
      sense_voice: './models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/model.int8.onnx'
      tokens: './models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/tokens.txt'
      num_threads: 4
      use_itn: True
      provider: 'cpu'

    groq_whisper_asr:
      api_key: ''
      model: 'whisper-large-v3-turbo'
      lang: 'en'

  # =================== Text to Speech ===================
  tts_config:
    # Options: 'azure_tts', 'pyttsx3_tts', 'edge_tts', 'bark_tts',
    #          'melo_tts', 'coqui_tts', 'piper_tts', 'fish_api_tts',
    #          'x_tts', 'gpt_sovits_tts', 'sherpa_onnx_tts',
    #          'elevenlabs_tts', 'cartesia_tts', 'openai_tts'
    tts_model: 'edge_tts'

    azure_tts:
      api_key: 'azure-api-key'
      region: 'eastus'
      voice: 'en-US-AshleyNeural'
      pitch: '26'
      rate: '1'

    bark_tts:
      voice: 'v2/en_speaker_1'

    edge_tts:
      # Use `edge-tts --list-voices` to list all available voices
      voice: 'en-US-AvaMultilingualNeural'

    piper_tts:
      model_path: 'models/piper/en_US-lessac-medium.onnx' # English model
      speaker_id: 0
      length_scale: 1.0
      noise_scale: 0.667
      noise_w: 0.8
      volume: 1.0
      normalize_audio: true
      use_cuda: false

    melo_tts:
      speaker: 'EN-Default'
      language: 'EN'
      device: 'auto'
      speed: 1.0

    x_tts:
      api_url: 'http://127.0.0.1:8020/tts_to_audio'
      speaker_wav: 'female'
      language: 'en'

    gpt_sovits_tts:
      api_url: 'http://127.0.0.1:9880/tts'
      text_lang: 'en'
      ref_audio_path: ''
      prompt_lang: 'en'
      prompt_text: ''
      text_split_method: 'cut5'
      batch_size: '1'
      media_type: 'wav'
      streaming_mode: 'false'

    fish_api_tts:
      api_key: ''
      reference_id: ''
      latency: 'balanced'
      base_url: 'https://api.fish.audio'

    coqui_tts:
      model_name: 'tts_models/en/ljspeech/tacotron2-DDC'
      speaker_wav: ''
      language: 'en'
      device: ''

    sherpa_onnx_tts:
      vits_model: '/path/to/tts-models/vits-piper-en_US-lessac-medium/model.onnx'
      vits_lexicon: ''
      vits_tokens: '/path/to/tts-models/vits-piper-en_US-lessac-medium/tokens.txt'
      vits_data_dir: '/path/to/tts-models/vits-piper-en_US-lessac-medium/espeak-ng-data'
      vits_dict_dir: ''
      tts_rule_fsts: ''
      max_num_sentences: 2
      sid: 0
      provider: 'cpu'
      num_threads: 1
      speed: 1.0
      debug: false

    openai_tts:
      model: 'kokoro'
      voice: 'af_sky+af_bella'
      api_key: 'not-needed'
      base_url: 'http://localhost:8880/v1'
      file_extension: 'mp3'

    elevenlabs_tts:
      api_key: ''
      voice_id: ''
      model_id: 'eleven_multilingual_v2'
      output_format: 'mp3_44100_128'
      stability: 0.5
      similarity_boost: 0.5
      style: 0.0
      use_speaker_boost: true

    cartesia_tts:
      api_key: ''
      voice_id: ''
      model_id: 'sonic-3'
      output_format: 'wav'
      language: 'en'
      emotion: 'neutral'
      volume: 1.0
      speed: 1.0

  # =================== Voice Activity Detection ===================
  vad_config:
    vad_model: null

    silero_vad:
      orig_sr: 16000
      target_sr: 16000
      prob_threshold: 0.4
      db_threshold: 60
      required_hits: 3
      required_misses: 24
      smoothing_window: 5

  tts_preprocessor_config:
    remove_special_char: True
    ignore_brackets: True
    ignore_parentheses: True
    ignore_asterisks: True
    ignore_angle_brackets: True

    translator_config:
      translate_audio: False
      translate_provider: 'deeplx'

      deeplx:
        deeplx_target_lang: 'EN'
        deeplx_api_endpoint: 'http://localhost:1188/v2/translate'

# Live streaming integration (placeholder — BiliBili removed)
live_config: {}
